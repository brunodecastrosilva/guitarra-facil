<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitarra Fácil</title>
<meta name="description" content="Ambiente visual e interativo para aprender, explorar e criar na guitarra, com treinos, braço virtual, tablatura, acordes, afinador e estúdio.">
<meta name="theme-color" content="#0c0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guitarra Fácil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&family=Big+Shoulders+Display:wght@700..900&display=swap">
<link rel="stylesheet" href="comum/kit-facil.css?v=0.25.2">
<style>
/* Guitarra Fácil: grafite de amplificador (preto, mas não tão preto), com detalhes cromados no modo escuro.
   O app muda só a cor de destaque, os neutros, a marca e as guias próprias (lei 6). */
:root{
  color-scheme:light;
  /* fonte dos títulos (Padrão 2.6; decisão 3A, opção A): Big Shoulders Display, com a Atkinson logo depois */
  --kf-font-display:"Big Shoulders Display","Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;
  --kf-bg:#E4E4E8; --kf-surface:#FFFFFF; --kf-surface-2:#DADADF; --kf-line:#CACAD1; --kf-line-2:#B1B1BB;
  --kf-ink:#101013; --kf-muted:#53535C; --gf-vermelho:#C8231A; --gf-vermelho-tx:#B01E16;
  --kf-accent:#2B2B30; --kf-accent-ink:#FFFFFF; --kf-accent-soft:#E2E2E5; --kf-accent-texto:#2B2B30;
  --kf-focus:#2B2B30; --kf-scrim:rgba(14,14,16,.5); --kf-shadow:0 10px 30px rgba(14,14,16,.16),0 2px 6px rgba(14,14,16,.08);
  --kf-col:880px; --kf-col-nav:720px;
}
/* modo escuro: automático (pelo aparelho) ou escolhido em Aparência; o destaque vira cromado */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --kf-bg:#08080A; --kf-surface:#131316; --kf-surface-2:#1D1D22; --kf-line:#28282F; --kf-line-2:#3A3A43;
  --kf-ink:#F2F2F5; --kf-muted:#A2A2AC; --gf-vermelho:#D7281D; --gf-vermelho-tx:#FF6B5E;
  --kf-accent:#D6D6DB; --kf-accent-ink:#18181B; --kf-accent-soft:#2E2E34; --kf-accent-texto:#E4E4E8;
  --kf-focus:#E4E4E8; --kf-scrim:rgba(0,0,0,.62); --kf-shadow:0 10px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --kf-bg:#08080A; --kf-surface:#131316; --kf-surface-2:#1D1D22; --kf-line:#28282F; --kf-line-2:#3A3A43;
  --kf-ink:#F2F2F5; --kf-muted:#A2A2AC; --gf-vermelho:#D7281D; --gf-vermelho-tx:#FF6B5E;
  --kf-accent:#D6D6DB; --kf-accent-ink:#18181B; --kf-accent-soft:#2E2E34; --kf-accent-texto:#E4E4E8;
  --kf-focus:#E4E4E8; --kf-scrim:rgba(0,0,0,.62); --kf-shadow:0 10px 30px rgba(0,0,0,.5);
}
body{margin:0;background:var(--kf-bg);color:var(--kf-ink);font-family:var(--kf-font);font-size:var(--kf-t-corpo);line-height:1.5}
.marca-ic{background:var(--kf-accent);color:var(--kf-accent-ink)}
.marca-ic svg{width:22px;height:22px}
main{max-width:var(--kf-col);margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--kf-nav-h) + 40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:1024px){main{padding-bottom:48px}}
h2{font:700 var(--kf-t-secao)/1.2 var(--kf-font-display);margin:0}
.pilha{display:flex;flex-direction:column;gap:14px}
.cartao{background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:16px;display:flex;flex-direction:column;gap:10px}
.cartao h3{margin:0;font:700 var(--kf-t-cartao)/1.3 var(--kf-font)}
.cartao p{margin:0}
.apoio{color:var(--kf-muted);font-size:var(--kf-t-apoio)}
/* ferramentas */
.metro-bpm{display:flex;align-items:center;justify-content:center;gap:8px}
.metro-bpm output{font:800 52px/1 var(--kf-font-display);font-variant-numeric:tabular-nums;min-width:3ch;text-align:center}
.metro-bpm .kf-btn{min-width:48px;padding:0 8px}
.batidas{display:flex;justify-content:center;gap:10px}
.batidas span{width:16px;height:16px;border-radius:50%;background:var(--kf-surface-2);box-shadow:inset 0 0 0 1px var(--kf-line-2);transition:background-color .1s}
.batidas span.on{background:var(--kf-accent)}
input[type=range]{width:100%;accent-color:var(--kf-accent);min-height:44px}
.acordes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.acorde{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--kf-surface);border:0;border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:12px 8px 10px;color:var(--kf-ink);font:inherit;cursor:pointer;min-height:44px}
.acorde b{font:700 20px/1 var(--kf-font-display)}
.acorde svg{width:100%;max-width:120px;height:auto;color:var(--kf-ink)}
/* músicas */
.musicas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.musica{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:14px 16px;font:inherit;color:inherit;min-height:56px}
.musica .kf-i{width:20px;height:20px;color:var(--kf-muted);flex:none}
.treinos .musica > span{display:flex;flex-direction:column;gap:2px}
.campo{display:flex;flex-direction:column;gap:6px}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.dado{background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:14px}
.dado b{display:block;font:800 28px/1.1 var(--kf-font-display)}
/* plano do dia */
.blocos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blocos li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center}
.bl-acao{min-height:44px;padding:0 14px}
.blocos li > b{font:800 15px/1.4 var(--kf-font);font-variant-numeric:tabular-nums;background:var(--kf-surface-2);border-radius:8px;text-align:center;padding:2px 0}
.blocos li span{display:flex;flex-direction:column}
/* mapa do braço */
.braco-wrap{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.braco{min-width:600px;width:100%;height:auto;display:block}
.braco .nota circle{fill:var(--kf-accent);transition:transform .2s}
.braco .nota text{fill:var(--kf-accent-ink);font:700 10.5px var(--kf-font);pointer-events:none}
.braco .nota.sust circle{fill:var(--kf-surface);stroke:var(--kf-accent);stroke-width:1.5}
.braco .nota.sust text{fill:var(--kf-ink);font-size:9px}
.braco .nota{cursor:pointer}
.braco .nota.tocou circle{fill:#C7432F}
.braco .nota:focus-visible{outline:none}
.braco .nota:focus-visible circle{stroke:var(--kf-focus);stroke-width:3}
.andas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.andas li{display:flex;justify-content:space-between;align-items:center;gap:12px}
.andas li > span{display:flex;flex-direction:column}
/* menu de botões grandes (ladrilhos) */
.ladrilhos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ladrilhos.l1{grid-template-columns:1fr}
.ladrilho{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:128px;padding:14px;border:0;border-radius:var(--kf-r-lg);background:var(--kf-surface);box-shadow:inset 0 0 0 1px var(--kf-line);color:var(--kf-ink);font:inherit;text-align:left;cursor:pointer;transition:background-color .28s cubic-bezier(.45,0,.2,1),box-shadow .28s cubic-bezier(.45,0,.2,1)}
.ladrilho:hover{box-shadow:inset 0 0 0 1.5px var(--kf-line-2)}
.ladrilho:focus-visible{outline:2.5px solid var(--kf-focus);outline-offset:2px}
.ladrilho.largo{flex-direction:row;align-items:center;min-height:96px}
.ladrilho.peq{min-height:96px;gap:4px}
.ladrilho.destaque,.ladrilho[aria-pressed="true"]{background:var(--kf-accent);color:var(--kf-accent-ink);box-shadow:none}
.ld-ilu{width:64px;height:48px;flex:none}
.ld-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ld-tx b{font:800 17px/1.25 var(--kf-font)}
.ld-tx small{font-size:var(--kf-t-apoio);color:var(--kf-muted);line-height:1.35}
.ladrilho.destaque small,.ladrilho[aria-pressed="true"] small{color:inherit;opacity:.85}
.ld-selo{position:absolute;top:10px;right:10px;font:700 12.5px/1 var(--kf-font);padding:5px 9px;border-radius:99px;background:var(--kf-surface-2);color:var(--kf-muted)}
.ladrilho.largo .ld-selo{position:static;margin-left:auto}
.ilu{width:64px;height:48px;display:block;overflow:visible}
.ilu .il-l{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.ilu .il-g{stroke-width:2.6;opacity:.9}
.ilu .il-f{fill:var(--kf-surface-2)}
.ilu .il-f.il-l{fill:var(--kf-surface-2)}
.ilu .il-n{fill:currentColor}
.ilu .il-o{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:3 2}
.ilu .il-a{fill:#C7432F}
.ilu .il-r{fill:none;stroke:#C7432F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ilu .il-tx text{font:800 9px var(--kf-font);fill:currentColor;text-anchor:middle}
.ilu .il-num{font:800 8px var(--kf-font);fill:var(--kf-surface);text-anchor:middle}
.ladrilho.destaque .il-f,.ladrilho[aria-pressed="true"] .il-f{fill:color-mix(in srgb,var(--kf-accent-ink) 14%,transparent)}
.ladrilho.destaque .il-num{fill:var(--kf-accent)}
/* caminho (voltar um passo) */
.migalhas{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:4px 0 -4px;font-size:var(--kf-t-apoio);color:var(--kf-muted)}
.migalhas button{border:0;background:none;padding:10px 4px;min-height:44px;color:var(--kf-accent-texto);font:600 var(--kf-t-apoio)/1 var(--kf-font);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.migalhas [aria-current]{font-weight:700;color:var(--kf-ink)}
.abas{margin:0 0 14px;max-width:none}
/* Início */
.seq{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-radius:var(--kf-r-lg);background:var(--kf-surface);box-shadow:inset 0 0 0 1px var(--kf-line)}
.seq-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--kf-surface-2)}
.seq-ic .kf-i{width:24px;height:24px;color:#C7432F}
.seq-tx{display:flex;flex-direction:column}
.seq-sem{display:flex;gap:4px}
.seq-sem i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--kf-line-2)}
.seq-sem i.feito{background:var(--kf-accent);box-shadow:none}
.seq-sem i.hoje{outline:2px solid #C7432F;outline-offset:1px}
.seq-barra{grid-column:1/-1;height:6px;margin-top:6px}
.continuar{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:var(--kf-r-lg);background:var(--kf-accent);color:var(--kf-accent-ink);font:inherit;text-align:left;cursor:pointer}
.continuar small{color:inherit;opacity:.85;font-size:var(--kf-t-apoio)}
.continuar .mini-braco{background:color-mix(in srgb,var(--kf-accent-ink) 12%,transparent)}
.continuar .mi-n{fill:var(--kf-accent-ink)}.continuar .mi-l,.continuar .mi-t{stroke:color-mix(in srgb,var(--kf-accent-ink) 45%,transparent)}
.ct-play{margin-left:auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#C7432F;color:#fff;flex:none}
.ct-play .kf-i{width:24px;height:24px;fill:currentColor}
/* lista de treinos */
.tr-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tr-item{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:8px 14px 8px 8px;border:0;border-radius:var(--kf-r-md);background:var(--kf-surface);box-shadow:inset 0 0 0 1px var(--kf-line);color:var(--kf-ink);font:inherit;text-align:left;cursor:pointer}
.tr-item > .kf-i{width:20px;height:20px;color:var(--kf-muted);margin-left:auto;flex:none}
.sortear{align-self:flex-start}
.mini-braco{width:92px;height:64px;flex:none;background:var(--kf-surface-2);border-radius:10px}
.mini-braco .mi-l{stroke:var(--kf-muted);stroke-width:1}.mini-braco .mi-t{stroke:var(--kf-line-2);stroke-width:1}
.mini-braco .mi-n{fill:var(--kf-accent)}.mini-braco .mi-n.raiz{fill:#C7432F}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.perm{display:flex;align-items:center;justify-content:center;min-height:44px;padding:4px 2px;border-radius:12px;border:1.5px solid var(--kf-line-2);background:var(--kf-surface);color:var(--kf-ink);font:inherit;cursor:pointer}
.perm b{font:800 14.5px/1.2 var(--kf-font);font-variant-numeric:tabular-nums;white-space:nowrap}
.perm[aria-pressed="true"]{background:var(--kf-accent);border-color:var(--kf-accent);color:var(--kf-accent-ink)}
/* ferramentas em tela própria */
.palco-ferr{align-items:center;text-align:center}
.palco-ferr .ladrilhos{width:100%}
.palco-ferr input[type=range]{max-width:520px}
.play-grande{width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;background:#C7432F;color:#fff;cursor:pointer;flex:none;box-shadow:0 6px 18px rgba(199,67,47,.32);transition:background-color .28s cubic-bezier(.45,0,.2,1)}
.play-grande .kf-i{width:34px;height:34px;fill:currentColor;stroke:none}
.play-grande.on{background:var(--kf-accent);color:var(--kf-accent-ink);box-shadow:none}
.play-grande:focus-visible{outline:3px solid var(--kf-focus);outline-offset:3px}
.batidas.grande{gap:14px}
.batidas.grande span{width:24px;height:24px}
.linha-ferr{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;width:100%}
.linha-ferr .kf-seg{min-width:240px}
.metro-bpm{flex-wrap:wrap}
.metro-bpm .kf-btn{font-weight:700}
.estilos .ladrilho{align-items:center;text-align:center}
/* afinador */
.afin{align-items:center;text-align:center}
.af-palco{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:12px;border-radius:var(--kf-r-lg);background:var(--kf-surface);box-shadow:inset 0 0 0 1px var(--kf-line)}
.af-medidor{width:min(100%,300px);height:auto}
.af-arco{fill:none;stroke:var(--kf-surface-2);stroke-width:16;stroke-linecap:round}
.af-certo{fill:none;stroke:#2F8F57;stroke-width:16}
.af-tick{stroke:var(--kf-muted);stroke-width:2}
.af-ponteiro{transform-origin:120px 128px;transition:transform .12s linear}
.af-ponteiro line{stroke:#C7432F;stroke-width:4;stroke-linecap:round}
.af-ponteiro circle{fill:#C7432F}
.af-nota{font:800 64px/1 var(--kf-font-display);min-height:64px;margin-top:-6px;transition:color .28s cubic-bezier(.45,0,.2,1)}
.af-nota.ok{color:#2F8F57}
.af-ligar{min-width:240px;min-height:52px}
.cordas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:100%}
.corda-bt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;border:0;border-radius:var(--kf-r-md);background:var(--kf-surface);box-shadow:inset 0 0 0 1px var(--kf-line);color:var(--kf-ink);font:inherit;cursor:pointer}
.corda-bt b{font:800 22px/1.1 var(--kf-font-display)}
.corda-bt small{font-size:12.5px;color:var(--kf-muted)}
.corda-bt.perto{box-shadow:inset 0 0 0 3px #C7432F}
.af-tipo{width:100%;max-width:320px;text-align:left}
.acordes b{font:700 18px/1.1 var(--kf-font-display)}
/* teoria em telas */
.te-sec{gap:12px}
/* palco escuro e vermelho (0.6.0): o vermelho do pedal nas trilhas, nos selos, nos botões de tocar e nos chips */
.barra-prog > span{background:var(--gf-vermelho)}
.ladrilho{box-shadow:inset 0 0 0 1px var(--kf-line),inset 0 3px 0 var(--gf-vermelho)}
.ld-selo{background:var(--gf-vermelho);color:#fff}
.play-grande,.ct-play{background:var(--gf-vermelho)}
.seq-sem i.feito{background:var(--gf-vermelho)}
.seq-ic .kf-i,.cq-nova > .kf-i{color:var(--gf-vermelho-tx)}
.migalhas button{color:var(--gf-vermelho-tx)}
.ladrilho.sub .ld-ilu{width:92px;height:64px}.ladrilho.sub .mini-braco{width:92px;height:64px}
.dia-hero{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:var(--kf-r-lg);background:linear-gradient(0deg,var(--kf-accent),var(--kf-accent));color:var(--kf-accent-ink);font:inherit;text-align:left;cursor:pointer;box-shadow:inset 4px 0 0 var(--gf-vermelho)}
.dia-hero small{color:inherit;opacity:.85;font-size:var(--kf-t-apoio)}
.dia-hero .il-f{fill:color-mix(in srgb,var(--kf-accent-ink) 14%,transparent)}
.dia-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dia-cab h2{flex:1;font-size:20px}
.dia-ir{align-self:flex-start}
.dia-lista{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:var(--kf-t-apoio)}
.continuar > .kf-i{width:22px;height:22px;margin-left:auto;flex:none}
.fav-ic{color:var(--gf-vermelho-tx)}
.tr-topo .tr-fav{pointer-events:auto;width:36px;height:36px;margin:-4px 0 0 -4px;border:0;border-radius:50%;background:var(--kf-surface-2);color:var(--gf-vermelho-tx);font-size:20px;line-height:1;cursor:pointer}
.tr-topo .tr-fav[aria-pressed="true"]{background:var(--gf-vermelho);color:#fff}
.tr-topo{justify-content:flex-start}
#tr-parte{background:var(--gf-vermelho);color:#fff}
#tr-volta{margin-left:auto}
.tr-aviso{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:2;padding:8px 14px;border-radius:99px;background:var(--kf-ink);color:var(--kf-bg);font-size:14px;box-shadow:var(--kf-shadow);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.tr-aviso[hidden],.tr-vista[hidden]{display:none}
.tab .tab-pm{font:700 10px var(--kf-font-mono);fill:var(--kf-muted)}
.tab .tab-pml{stroke:var(--kf-muted);stroke-dasharray:3 3}
/* braço do treino: sempre no mesmo tamanho (--br-esc), deslizando até as notas da vez */
html{touch-action:manipulation} /* toque duplo não dá zoom; o gesto de pinça continua livre */
.tr-braco{position:relative;padding:0;--br-esc:1.1}
@media (min-width:820px){.tr-braco{--br-esc:1.2}}
.tr-braco[hidden],.tab-wrap[hidden],.tr-dica[hidden]{display:none}
.tr-braco-vis{overflow:hidden;margin-left:calc(22px * var(--br-esc))}
.tr-braco-trilho{width:max-content;transition:transform 560ms cubic-bezier(.45,0,.2,1);will-change:transform}
.tr-braco-cordas{position:absolute;left:0;top:0;bottom:0;background:var(--kf-surface)}
.braco-cordas{display:block;width:calc(22px * var(--br-esc));height:auto}
.braco-cordas .tab-r{font:700 11px var(--kf-font-mono);fill:var(--kf-muted)}
.braco-tr{display:block;width:calc(1236px * var(--br-esc));height:auto;max-width:none}
.braco-tr .nt{transform-box:fill-box;transform-origin:center}
.braco-tr .nt > *{transform-box:fill-box;transform-origin:center}
/* técnicas no braço: bend e volta (a nota sai da corda), slide (a nota corre pela corda), ligados e tapping
   (o dedo bate ou puxa) e vibrato ou trinado (a nota balança); --d é a duração da nota e --dir o lado do bend */
.braco-tr .nt.an-b{--dy:calc(var(--dir) * 18px);animation:gf-bend var(--d) ease-in-out both}
.braco-tr .nt.an-b2{--dy:calc(var(--dir) * 9px);animation:gf-bend var(--d) ease-in-out both}
.braco-tr .nt.an-r{--dy:calc(var(--dir) * 18px);animation:gf-volta var(--d) ease-in-out both}
.braco-tr .nt.an-s{animation:gf-slide calc(var(--d) * .4 + .08s) cubic-bezier(.45,0,.2,1) both}
.braco-tr .nt.an-h,.braco-tr .nt.an-t{animation:gf-martelo .3s ease-out both}
.braco-tr .nt.an-p{animation:gf-puxa .3s ease-out both}
.braco-tr .nt.an-v > *{animation:gf-vib .2s ease-in-out calc(var(--d) * .2) infinite alternate}
.braco-tr .nt.an-tr > *{animation:gf-vib .11s ease-in-out infinite alternate}
@keyframes gf-bend{0%,12%{transform:translateY(0)}45%,100%{transform:translateY(var(--dy))}}
@keyframes gf-volta{0%,5%{transform:translateY(var(--dy))}50%,100%{transform:translateY(0)}}
@keyframes gf-slide{from{transform:translateX(-100px);opacity:.55}to{transform:none;opacity:1}}
@keyframes gf-martelo{0%{transform:scale(1.5)}40%{transform:scale(.88)}70%{transform:scale(1.06)}100%{transform:none}}
@keyframes gf-puxa{0%{transform:translateY(calc(var(--dir) * -7px))}60%{transform:translateY(calc(var(--dir) * 2px))}100%{transform:none}}
@keyframes gf-vib{from{transform:translateY(-2.5px)}to{transform:translateY(2.5px)}}
@media (prefers-reduced-motion:reduce){.tr-braco-trilho{transition:none}.braco-tr .nt[class*="an-"],.braco-tr .nt[class*="an-"] > *{animation:none}}

/* caminho do iniciante: as etapas numa linha vertical; feita = marca e texto, atual = vermelho e "Você está aqui" */

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guitarra Fácil</title>
<meta name="description" content="Treinos de guitarra elétrica no seu andamento, com o braço desenhado: cromático 1-2-3-4 nas 24 combinações, escalas nos cinco desenhos, teoria, metrônomo e afinador">
<meta name="theme-color" content="#F3F3F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Guitarra Fácil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
<link rel="stylesheet" href="comum/kit-facil.css?v=0.4.0">
<style>
/* Guitarra Fácil: grafite de amplificador (preto, mas não tão preto), com detalhes cromados no modo escuro.
   O app muda só a cor de destaque, os neutros, a marca e as guias próprias (lei 6). */
:root{
  color-scheme:light;
  --kf-bg:#F3F3F1; --kf-surface:#FFFFFF; --kf-surface-2:#EAEAE7; --kf-line:#DAD9D4; --kf-line-2:#C8C7C1;
  --kf-ink:#18181B; --kf-muted:#5B5B60;
  --kf-accent:#2B2B30; --kf-accent-ink:#FFFFFF; --kf-accent-soft:#E2E2E5; --kf-accent-texto:#2B2B30;
  --kf-focus:#2B2B30; --kf-scrim:rgba(14,14,16,.5); --kf-shadow:0 10px 30px rgba(14,14,16,.16),0 2px 6px rgba(14,14,16,.08);
  --kf-col:880px; --kf-col-nav:720px;
}
/* modo escuro: automático (pelo aparelho) ou escolhido em Aparência; o destaque vira cromado */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --kf-bg:#111113; --kf-surface:#1B1B1E; --kf-surface-2:#242428; --kf-line:#2F2F34; --kf-line-2:#3E3E44;
  --kf-ink:#F1F1F3; --kf-muted:#A6A6AD;
  --kf-accent:#D6D6DB; --kf-accent-ink:#18181B; --kf-accent-soft:#2E2E34; --kf-accent-texto:#E4E4E8;
  --kf-focus:#E4E4E8; --kf-scrim:rgba(0,0,0,.62); --kf-shadow:0 10px 30px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --kf-bg:#111113; --kf-surface:#1B1B1E; --kf-surface-2:#242428; --kf-line:#2F2F34; --kf-line-2:#3E3E44;
  --kf-ink:#F1F1F3; --kf-muted:#A6A6AD;
  --kf-accent:#D6D6DB; --kf-accent-ink:#18181B; --kf-accent-soft:#2E2E34; --kf-accent-texto:#E4E4E8;
  --kf-focus:#E4E4E8; --kf-scrim:rgba(0,0,0,.62); --kf-shadow:0 10px 30px rgba(0,0,0,.5);
}
body{margin:0;background:var(--kf-bg);color:var(--kf-ink);font-family:var(--kf-font);font-size:var(--kf-t-corpo);line-height:1.5}
.marca-ic{background:var(--kf-accent);color:var(--kf-accent-ink)}
.marca-ic svg{width:22px;height:22px}
main{max-width:var(--kf-col);margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--kf-nav-h) + 40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:1024px){main{padding-bottom:48px}}
h2{font:700 var(--kf-t-secao)/1.2 var(--kf-font-display);margin:0}
.pilha{display:flex;flex-direction:column;gap:14px}
.cartao{background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:16px;display:flex;flex-direction:column;gap:10px}
.cartao h3{margin:0;font:700 var(--kf-t-cartao)/1.3 var(--kf-font)}
.cartao p{margin:0}
.apoio{color:var(--kf-muted);font-size:var(--kf-t-apoio)}
/* tela Hoje */
.ola{display:flex;flex-direction:column;gap:6px;padding:8px 0 2px}
.ola h1{margin:0;font:800 30px/1.1 var(--kf-font-display);letter-spacing:-.025em}
.passo{background:var(--kf-accent);color:var(--kf-accent-ink);border-radius:var(--kf-r-lg);padding:20px;display:flex;flex-direction:column;gap:10px}
.passo .apoio{color:inherit;opacity:.85}
.passo h2{font-size:24px}
.passo .kf-btn{align-self:flex-start;background:var(--kf-accent-ink);color:var(--kf-accent)}
.barra-prog{height:10px;border-radius:99px;background:var(--kf-surface-2);overflow:hidden}
.barra-prog > span{display:block;height:100%;background:var(--kf-accent);border-radius:inherit;transition:width .56s cubic-bezier(.45,0,.2,1)}
.passo .barra-prog{background:color-mix(in srgb,var(--kf-accent-ink) 20%,transparent)}
.passo .barra-prog > span{background:var(--kf-accent-ink)}
details[data-kf-secao] > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
details[data-kf-secao] > summary::-webkit-details-marker{display:none}
details[data-kf-secao] > summary::after{content:'';flex:none;width:9px;height:9px;margin:0 6px 4px 0;border-right:2.5px solid var(--kf-muted);border-bottom:2.5px solid var(--kf-muted);transform:rotate(45deg);transition:transform .56s cubic-bezier(.45,0,.2,1)}
details[data-kf-secao][open] > summary::after{transform:translateY(4px) rotate(-135deg)}
details.cartao[open] > :not(summary){margin-top:2px}
#f-afinador h3{margin-top:10px}
#af-ligar{margin-top:4px}
.nivel-tt{display:flex;flex-direction:column;gap:2px}
/* ferramentas */
.metro-bpm{display:flex;align-items:center;justify-content:center;gap:16px}
.metro-bpm output{font:800 52px/1 var(--kf-font-display);font-variant-numeric:tabular-nums;min-width:3ch;text-align:center}
.metro-bpm .kf-btn{min-width:56px}
.batidas{display:flex;justify-content:center;gap:10px}
.batidas span{width:16px;height:16px;border-radius:50%;background:var(--kf-surface-2);box-shadow:inset 0 0 0 1px var(--kf-line-2);transition:background-color .1s}
.batidas span.on{background:var(--kf-accent)}
input[type=range]{width:100%;accent-color:var(--kf-accent);min-height:44px}
.cordas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cordas .kf-btn{flex-direction:column;gap:0;min-height:64px;padding:6px 0;font-size:20px}
.cordas small{font-size:12.5px;font-weight:400;color:var(--kf-muted)}
.acordes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.acorde{background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:12px 8px 8px;text-align:center}
.acorde b{font:700 20px/1 var(--kf-font-display)}
.acorde svg{width:100%;max-width:120px;height:auto;color:var(--kf-ink)}
/* músicas */
.musicas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.musica{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:14px 16px;font:inherit;color:inherit;min-height:56px}
.musica .kf-i{width:20px;height:20px;color:var(--kf-muted);flex:none}
.treinos .musica > span{display:flex;flex-direction:column;gap:2px}
.campo{display:flex;flex-direction:column;gap:6px}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.dado{background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line);padding:14px}
.dado b{display:block;font:800 28px/1.1 var(--kf-font-display)}
/* plano do dia */
.blocos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.blocos li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center}
.bl-acao{min-height:44px;padding:0 14px}
.blocos li > b{font:800 15px/1.4 var(--kf-font);font-variant-numeric:tabular-nums;background:var(--kf-surface-2);border-radius:8px;text-align:center;padding:2px 0}
.blocos li span{display:flex;flex-direction:column}
/* afinador */
.afinador{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0}
.af-nota{font:800 56px/1 var(--kf-font-display);min-height:56px;transition:color .28s cubic-bezier(.45,0,.2,1)}
.af-nota.ok{color:#2F8F57}
.af-escala{position:relative;width:min(100%,320px);height:28px;border-radius:99px;background:var(--kf-surface-2);overflow:hidden}
.af-zero{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--kf-line-2)}
.af-ponteiro{position:absolute;left:50%;top:3px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--kf-accent);transition:transform .12s linear}
/* mapa do braço */
.braco-wrap{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.braco{min-width:600px;width:100%;height:auto;display:block}
.braco .nota circle{fill:var(--kf-accent);transition:transform .2s}
.braco .nota text{fill:var(--kf-accent-ink);font:700 10.5px var(--kf-font);pointer-events:none}
.braco .nota.sust circle{fill:var(--kf-surface);stroke:var(--kf-accent);stroke-width:1.5}
.braco .nota.sust text{fill:var(--kf-ink);font-size:9px}
.braco .nota{cursor:pointer}
.braco .nota.tocou circle{fill:#C7432F}
.braco .nota:focus-visible{outline:none}
.braco .nota:focus-visible circle{stroke:var(--kf-focus);stroke-width:3}
.andas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.andas li{display:flex;justify-content:space-between;align-items:center;gap:12px}
.andas li > span{display:flex;flex-direction:column}
/* sequência (Hoje) */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seq-cab{display:flex;align-items:center;gap:12px}
.seq-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--kf-accent-ink) 14%,transparent);flex:none}
.seq-ic .kf-i{width:26px;height:26px;color:#FF8A73}
.semana{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.semana li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.sem-c{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--kf-accent-ink) 40%,transparent)}
.sem-c .kf-i{width:18px;height:18px}
.semana li.feito .sem-c{background:var(--kf-accent-ink);color:var(--kf-accent);box-shadow:none}
.semana li.hoje .sem-d{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.semana li.hoje .sem-c{box-shadow:inset 0 0 0 2.5px #FF8A73}
.semana li.hoje.feito .sem-c{box-shadow:none}
.continuar .kf-btn,.cartao > .kf-btn{align-self:flex-start}
.dados.mini{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.dados.mini .dado{background:var(--kf-surface-2);box-shadow:none}
.cq-nova{display:flex;gap:10px;align-items:center;margin:0;padding:10px 12px;border-radius:var(--kf-r-md);background:var(--kf-surface-2)}
.cq-nova > .kf-i{width:28px;height:28px;color:#C7432F;flex:none}
.cq-nova > span{display:flex;flex-direction:column}
/* treinos */
.tr-cat-cab{display:flex;gap:14px;align-items:center}
.mini-braco{width:92px;height:64px;flex:none;background:var(--kf-surface-2);border-radius:10px}
.mini-braco .mi-l{stroke:var(--kf-muted);stroke-width:1}.mini-braco .mi-t{stroke:var(--kf-line-2);stroke-width:1}
.mini-braco .mi-n{fill:var(--kf-accent)}.mini-braco .mi-n.raiz{fill:#C7432F}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.perm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:52px;padding:4px 2px;border-radius:12px;border:1.5px solid var(--kf-line-2);background:var(--kf-surface);color:var(--kf-ink);font:inherit;cursor:pointer;transition:background-color .28s cubic-bezier(.45,0,.2,1),border-color .28s cubic-bezier(.45,0,.2,1)}
.perm b{font:800 14.5px/1.2 var(--kf-font);font-variant-numeric:tabular-nums;white-space:nowrap}
.perm small{font-size:12px;color:var(--kf-muted)}
.perm.feita{background:var(--kf-accent-soft);border-color:var(--kf-accent-soft)}
.perm.dia{border-color:#C7432F;border-width:2px}
.perm[aria-pressed="true"]{background:var(--kf-accent);border-color:var(--kf-accent);color:var(--kf-accent-ink)}
.perms-dlg{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.perms-dlg .perm{min-height:44px}
.perms-prog .perm{cursor:default;min-height:48px}
.tr-sortear{align-self:flex-start;margin-top:4px}
.desenhos-tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.des-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:1.5px solid var(--kf-line-2);background:var(--kf-surface);color:var(--kf-ink);font:inherit;cursor:pointer}
.des-it small{font-size:12.5px;color:var(--kf-muted)}
.te-acoes{display:flex;flex-wrap:wrap;gap:8px}
/* braço do treino */
.tr-braco{padding:6px 6px 0}
.braco-tr{width:100%;height:auto;display:block;max-height:230px}
.braco-tr .bt-madeira{fill:var(--kf-surface-2)}
.braco-tr .bt-traste{stroke:var(--kf-line-2);stroke-width:2}
.braco-tr .bt-pestana{stroke:var(--kf-muted);stroke-width:6}
.braco-tr .bt-corda{stroke:var(--kf-muted)}
.braco-tr .bt-ponto{fill:var(--kf-muted)}
.braco-tr .casa-n{font:600 11px var(--kf-font);fill:var(--kf-muted)}
.braco-tr .tab-r{font:700 11px var(--kf-font-mono);fill:var(--kf-muted)}
.braco-tr .nt circle{fill:var(--kf-surface);stroke:var(--kf-accent);stroke-width:2;transition:fill .08s linear}
.braco-tr .nt text{font:800 12.5px var(--kf-font);fill:var(--kf-ink)}
.braco-tr .nt.raiz circle{stroke:#C7432F;stroke-width:3}
.braco-tr .nt.prox circle{stroke-width:4;stroke-dasharray:4 3}
.braco-tr .nt.agora circle{fill:#C7432F;stroke:#C7432F}
.braco-tr .nt.agora text{fill:#fff}
.tr-status{margin:0;font-size:var(--kf-t-apoio);color:var(--kf-muted)}
.tr-vel .metro-bpm{gap:8px;flex-wrap:wrap}
.tr-vel .metro-bpm .kf-btn{min-width:48px;padding:0 8px;font-weight:700}
.tr-limpo{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
/* conquistas */
.conquistas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.conquistas li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--kf-r-md);background:var(--kf-surface-2)}
.conquistas li > span:last-child{display:flex;flex-direction:column}
.cq-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1.5px var(--kf-line-2);color:var(--kf-muted)}
.cq-ic .kf-i{width:22px;height:22px}
.conquistas li.ganha .cq-ic{background:#C7432F;color:#fff;box-shadow:none}
.conquistas li:not(.ganha) b{color:var(--kf-muted)}
.g-hoje{font-weight:800;fill:var(--kf-ink)}
.g-med{fill:var(--kf-line-2)}.g-ok{fill:var(--kf-accent)}
/* listas */
.treinos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sec-h{font:800 22px/1.2 var(--kf-font-display);margin:10px 0 0}
.sub-h{font:700 17px/1.3 var(--kf-font);margin:0}
.kf-opcoes.estilos,.kf-opcoes.desenhos{display:flex;flex-wrap:wrap;gap:8px}
.chip-est{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--kf-line-2);background:var(--kf-surface);color:var(--kf-ink);font:600 15px var(--kf-font);cursor:pointer;transition:background-color .28s cubic-bezier(.45,0,.2,1),color .28s cubic-bezier(.45,0,.2,1)}
.chip-est[aria-pressed="true"]{background:var(--kf-accent);border-color:var(--kf-accent);color:var(--kf-accent-ink)}
/* playlists */
.playlist > summary{gap:12px;justify-content:flex-start}
.playlist > summary .nivel-tt{flex:1}
.pl-capa{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:800 24px var(--kf-font-display);color:#fff;flex:none}
.pl-capa .kf-i{width:26px;height:26px}
.pl-capa.n1{background:#2F8F57}.pl-capa.n2{background:#C7432F}.pl-capa.n3{background:#2B2B30}.pl-capa.n4{background:#2742D3}.pl-capa.n5{background:#8A3FB8}
.faixas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.faixas li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:12px 0;border-top:1px solid var(--kf-line)}
.fx-n{font:700 15px var(--kf-font);color:var(--kf-muted);padding-top:2px}
.fx-t{display:flex;flex-direction:column}
.fx-a{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.fx-l{min-height:40px;padding:0 12px;font-size:14px}
/* teoria */
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.legenda{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--kf-muted);flex-wrap:wrap}
.lg{width:14px;height:14px;border-radius:50%;background:var(--kf-accent);display:inline-block;margin-left:6px}
.lg.raiz{background:#C7432F}
.braco .nota.raiz circle{fill:#C7432F}
.braco .nota.raiz text{fill:#fff}
.braco .nota.fora{opacity:.28}
.braco .casa-n{font:600 10px var(--kf-font);fill:var(--kf-muted)}
.ac-cifra{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ac-cifra > b{font:800 34px/1 var(--kf-font-display)}
.ac-cifra > span{display:flex;gap:6px;flex-wrap:wrap}
.ac-g{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:6px 8px;border-radius:10px;background:var(--kf-surface-2);font:700 14px var(--kf-font)}
.ac-g small{font:600 12.5px var(--kf-font);color:var(--kf-muted)}
.circ-wrap{display:flex;justify-content:center}
.circulo{width:min(100%,340px);height:auto}
.circulo .tom{cursor:pointer}
.circulo .tom circle{fill:var(--kf-surface);stroke:var(--kf-line-2);stroke-width:1.5;transition:fill .28s cubic-bezier(.45,0,.2,1)}
.circulo .tom.on circle{fill:#C7432F;stroke:#C7432F}
.circulo .tom-M{font:800 15px var(--kf-font);fill:var(--kf-ink)}
.circulo .tom.on .tom-M{fill:#fff}
.circulo .tom-m{font:600 11.5px var(--kf-font);fill:var(--kf-muted)}
.circulo .tom-c{font:800 30px var(--kf-font-display);fill:var(--kf-ink)}
.circulo .tom-a{font:600 12px var(--kf-font);fill:var(--kf-muted)}
.circulo .tom:focus-visible{outline:none}.circulo .tom:focus-visible circle{stroke:var(--kf-focus);stroke-width:3}
.campo-h{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ch-it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:0;cursor:pointer;background:var(--kf-surface-2);color:var(--kf-ink);font:inherit;min-height:44px}
.ch-it small{font:700 12.5px var(--kf-font);color:var(--kf-muted)}
.ch-it b{font:800 20px var(--kf-font-display)}
.ch-it span{font-size:13px;color:var(--kf-muted)}
.ch-it em{font-style:normal;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:99px}
.ch-it.f-tônica em{background:#DDEFE3;color:#1F6B3F}.ch-it.f-subdominante em{background:#E3E7FB;color:#2742D3}.ch-it.f-dominante em{background:#FBE3DF;color:#A43524}
.intervalos,.figuras{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.int-it,.fig-it{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px;border-radius:12px;border:0;cursor:pointer;background:var(--kf-surface-2);color:var(--kf-ink);font:inherit}
.int-barra{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:100%;margin-bottom:4px}
.int-barra i{height:8px;border-radius:3px;background:var(--kf-line)}
.int-barra i.meio{background:var(--kf-line-2)}
.int-barra i.on{background:#C7432F}
.fig-it{flex-direction:row;align-items:center;gap:10px}
.figura{width:34px;height:42px;color:var(--kf-ink);flex:none}
.fig-it b{display:block}
/* treino */
.tr-palco{position:relative;background:var(--kf-surface);border-radius:var(--kf-r-md);box-shadow:inset 0 0 0 1px var(--kf-line)}
.tab-wrap{overflow-x:auto;scrollbar-width:thin;padding:6px 0}
.tab .tab-r{font:700 12px var(--kf-font-mono);fill:var(--kf-muted)}
.tab .tab-l{stroke:var(--kf-line-2);stroke-width:1.2}
.tab .tab-b{stroke:var(--kf-line);stroke-width:1}
.tab .tab-b.forte{stroke:var(--kf-line-2);stroke-width:2}
.tab-n rect{fill:var(--kf-surface);stroke:var(--kf-ink);stroke-width:1.5;transition:fill .15s}
.tab-n text{font:700 13px var(--kf-font-mono);fill:var(--kf-ink)}
.tab-n.agora rect{fill:#2B2B30;stroke:#2B2B30}.tab-n.agora text{fill:#fff}
.tab-n.ok rect{fill:#DDEFE3;stroke:#2F8F57}.tab-n.erro rect{fill:#FBE3DF;stroke:#C7432F}
.tab-cursor{stroke:#C7432F;stroke-width:2.5}
.tr-conta{position:absolute;inset:0;display:grid;place-items:center;font:800 64px var(--kf-font-display);color:#C7432F;pointer-events:none;opacity:0;transition:opacity .2s}
.tr-conta.on{opacity:1;background:color-mix(in srgb,var(--kf-surface) 70%,transparent)}
.tr-vel{display:flex;flex-direction:column;gap:6px}
.tr-vel .metro-bpm{justify-content:flex-start}
.tr-vel output{font-size:36px}
.tr-op{display:flex;flex-direction:column;gap:6px}
.tr-op .kf-check span{display:inline-flex;align-items:center;gap:6px}
.tr-op .kf-i{width:18px;height:18px}
.tr-res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tr-nota{border-radius:var(--kf-r-md);background:var(--kf-surface-2);padding:12px;display:flex;flex-direction:column}
.tr-nota b{font:800 34px/1 var(--kf-font-display)}
.tr-nota.ok b{color:#2F8F57}.tr-nota.med b{color:#B07A12}.tr-nota.ruim b{color:#C7432F}
.tr-fala{grid-column:1/-1;margin:0;padding:12px 14px;border-radius:4px 16px 16px 16px;background:var(--kf-surface-2)}
.grafico svg{width:100%;height:auto}

.g-t{font:600 10px var(--kf-font);fill:var(--kf-muted)}
.g-meta{stroke:var(--kf-muted);stroke-dasharray:4 4}
:root[data-theme="dark"] .ch-it.f-tônica em,:root[data-theme="dark"] .ch-it.f-subdominante em,:root[data-theme="dark"] .ch-it.f-dominante em{background:var(--kf-surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ch-it em{background:var(--kf-surface)!important;color:var(--kf-ink)!important}:root:not([data-theme="light"]) .tab-n.ok rect{fill:#1F3B2A}:root:not([data-theme="light"]) .tab-n.erro rect{fill:#4A1E18}}
:root[data-theme="dark"] .tab-n.ok rect{fill:#1F3B2A}:root[data-theme="dark"] .tab-n.erro rect{fill:#4A1E18}
@media (prefers-reduced-motion:reduce){.perm,.braco-tr .nt circle,.chip-est,.circulo .tom circle,.tab-n rect{transition:none}}
@media (prefers-reduced-motion:reduce){.barra-prog > span,.af-nota,.af-ponteiro,details[data-kf-secao] > summary::after{transition:none}}
</style>
</head>
<body class="kf-casca">
<header class="kf-barra"><div class="kf-barra-in"><div class="kf-marca"><span class="kf-marca-ic marca-ic" id="marca"></span><span class="kf-marca-nome">Guitarra Fácil</span></div><div id="topo"></div></div></header>
<aside class="kf-trilho" aria-label="Navegação"><div class="kf-marca"><span class="kf-marca-ic marca-ic" id="marca-trilho"></span><span class="kf-marca-nome">Guitarra Fácil</span></div><div id="trilho"></div><span id="trilho-ajustes"></span></aside>
<main id="main"></main>
<nav class="kf-nav" aria-label="Seções"><div class="kf-nav-in" id="nav"></div></nav>

name: Verificar aplicativo
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run verificar
      - run: npm test
      - name: Registrar telas para revisão visual
        if: always()
        run: node tests/visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revisao-visual
          path: revisao-visual/
          retention-days: 7
